</head>
<body>
  <div id="root"></div>
  <script type="module">
    // No JSX anywhere in this file - every component is React.createElement - so
    // there is nothing to transpile and no Babel. React 19 ships no UMD build,
    // hence the import map above.
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    const { useState, useEffect, useCallback, useRef } = React;

    const api = {
      async load() {
        const res = await fetch('/api/budget');
        return res.json();
      },
      async save(data) {
        const res = await fetch('/api/budget', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        return res.json();
      }
    };

    function currency(n) {
      return `£${n.toFixed(2)}`;
    }

    function signedCurrency(n) {
      return `${n < 0 ? '-' : '+'}£${Math.abs(n).toFixed(2)}`;
    }

    function signedPercent(n) {
      return `${n < 0 ? '-' : '+'}${Math.abs(n).toFixed(2)}%`;
    }

    // Single source of truth for colour. Contrast is deliberate: the old palette
    // sat everything within a few steps of the background and was hard to read.
    const c = {
      surface: 'rgba(22,32,52,0.82)',
      surfaceHi: 'rgba(30,43,70,0.92)',
      inset: 'rgba(9,14,26,0.55)',
      border: 'rgba(148,163,184,0.16)',
      borderHi: 'rgba(148,163,184,0.32)',
      text: '#f4f7fb',
      dim: '#b6c2d4',
      faint: '#8496ad',
      green: '#4ade80',
      red: '#fb7185',
      amber: '#fbbf24',
      blue: '#7dd3fc',
      pink: '#f9a8d4',
    };

    const uid = () => Math.random().toString(36).slice(2, 10);

    const ordinal = (n) => {
      const suffix = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (suffix[(v - 20) % 10] || suffix[v] || suffix[0]);
    };

    // Next occurrence of a day-of-month, clamped to short months (a 31st bill
    // lands on the 28th/30th rather than skipping the month).
    const nextDueDate = (day, from = new Date()) => {
      const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
      const inMonth = (offset) => {
        const y = today.getFullYear(), m = today.getMonth() + offset;
        const last = new Date(y, m + 1, 0).getDate();
        return new Date(y, m, Math.min(day, last));
      };
      const thisMonth = inMonth(0);
      return thisMonth >= today ? thisMonth : inMonth(1);
    };
    const daysUntil = (date, from = new Date()) => {
      const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
      return Math.round((date - today) / 86400000);
    };
    // Paydays land on working days: a date falling on a weekend or an England &
    // Wales bank holiday rolls back to the working day before (the 25th on a
    // Saturday pays on the 24th). `holidays` is a Set of YYYY-MM-DD strings from
    // /api/bank-holidays; an empty one degrades to weekends-only.
    const NO_HOLIDAYS = new Set();
    const isoDate = (date) => date.getFullYear() + '-' +
      String(date.getMonth() + 1).padStart(2, '0') + '-' +
      String(date.getDate()).padStart(2, '0');
    const isWeekend = (date) => date.getDay() === 0 || date.getDay() === 6;
    const backToWorkingDay = (date, holidays = NO_HOLIDAYS) => {
      const d = new Date(date);
      let guard = 0;
      while ((isWeekend(d) || holidays.has(isoDate(d))) && guard++ < 30) d.setDate(d.getDate() - 1);
      return d;
    };
    // A payday is a day-of-month, or 'last' for the last working day of the month.
    const payDayOf = (value, fallback) => value === 'last' ? 'last'
      : (typeof value === 'number' && value >= 1 && value <= 31 ? Math.round(value) : fallback);
    const payDateIn = (payDay, year, month, holidays) => {
      const lastDay = new Date(year, month + 1, 0).getDate();
      return backToWorkingDay(new Date(year, month, payDay === 'last' ? lastDay : Math.min(payDay, lastDay)), holidays);
    };
    const nextPayDate = (payDay, holidays = NO_HOLIDAYS, from = new Date()) => {
      const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
      const thisMonth = payDateIn(payDay, today.getFullYear(), today.getMonth(), holidays);
      return thisMonth >= today ? thisMonth : payDateIn(payDay, today.getFullYear(), today.getMonth() + 1, holidays);
    };
    const payDayLabel = (payDay) => payDay === 'last' ? 'Last working day' : ordinal(payDay);
    const dayMonth = (date) => date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });

    const relativeDay = (days) => days === 0 ? 'today' : days === 1 ? 'tomorrow' : 'in ' + days + ' days';
    const monthYear = (date) => date.toLocaleDateString(undefined, { month: 'short', year: 'numeric' });

    // Months of saving before a balance reaches the target, compounding the
    // linked accounts' blended rate monthly alongside the contribution.
    const monthsToTarget = (saved, target, monthly, annualRate) => {
      if (saved >= target) return 0;
      if (monthly <= 0 && annualRate <= 0) return null;
      let balance = saved, months = 0;
      while (balance < target && months < 600) {
        balance = balance * (1 + annualRate / 12) + monthly;
        months++;
      }
      return balance >= target ? months : null;
    };

    const addMonths = (date, n) => new Date(date.getFullYear(), date.getMonth() + n, date.getDate());
    const parseISODate = (value) => {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
      const [y, m, d] = value.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return isNaN(date.getTime()) ? null : date;
    };
    const fullDate = (date) => date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    const yearsMonths = (months) => {
      const y = Math.floor(months / 12), m = months % 12;
      if (!y) return m + (m === 1 ? ' month' : ' months');
      if (!m) return y + (y === 1 ? ' year' : ' years');
      return y + 'y ' + m + 'm';
    };

    // Whole months from one date to another — a payment on the 5th only counts
    // once the 5th has come round again.
    const monthsBetween = (from, to) =>
      (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth()) -
      (to.getDate() < from.getDate() ? 1 : 0);

    // Run `months` payments and report what they bought. Used to split what has
    // been paid so far into interest and capital.
    const amortiseFor = (balance, annualRate, payment, months) => {
      const monthlyRate = annualRate / 100 / 12;
      let remaining = balance, interest = 0, paid = 0;
      for (let i = 0; i < months && remaining > 0; i++) {
        const charge = remaining * monthlyRate;
        const due = Math.min(payment, remaining + charge);
        interest += charge;
        paid += due;
        remaining = remaining + charge - due;
      }
      return { interest, paid, capital: paid - interest, remaining: Math.max(0, remaining) };
    };

    // Amortisation, run month by month rather than from a closed-form formula:
    // interest follows the shrinking balance, so the total is the real one and
    // an overpayment can simply be added to the payment. Returns null when the
    // payment doesn't cover the monthly interest — the balance would grow.
    const amortise = (balance, annualRate, payment) => {
      if (!(balance > 0)) return { months: 0, interest: 0 };
      if (!(payment > 0)) return null;
      const monthlyRate = annualRate / 100 / 12;
      if (payment <= balance * monthlyRate) return null;
      let remaining = balance, interest = 0, months = 0;
      while (remaining > 0 && months < 1200) {
        const charge = remaining * monthlyRate;
        interest += charge;
        remaining = remaining + charge - payment;
        months++;
      }
      return { months, interest };
    };

    // Bill categories. `id` is what lands in budget.json, so these ids are a
    // stable contract with saved data - relabel freely, don't renumber.
    // Hues are the validated dark-mode categorical slots, in slot order — that
    // order is the colourblind-safety mechanism, so the donut draws its slices in
    // it rather than by size. Don't reorder or re-hex without re-running the
    // palette validator against the card surface (#141d30).
    const CATEGORIES = [
      { id: 'housing',       label: 'Housing',    icon: '🏠', color: '#3987e5' },
      { id: 'utilities',     label: 'Utilities',  icon: '💡', color: '#d95926' },
      { id: 'food',          label: 'Food',       icon: '🛒', color: '#199e70' },
      { id: 'transport',     label: 'Transport',  icon: '🚗', color: '#c98500' },
      { id: 'insurance',     label: 'Insurance',  icon: '🛡️', color: '#d55181' },
      { id: 'childcare',     label: 'Childcare',  icon: '🧸', color: '#008300' },
      { id: 'entertainment', label: 'Fun',        icon: '🎬', color: '#9085e9' },
      { id: 'health',        label: 'Health',     icon: '💊', color: '#e66767' },
      { id: 'other',         label: 'Other',      icon: '📦', color: '#7c8ba1' },
    ];
    const OTHER = CATEGORIES[CATEGORIES.length - 1];
    // Reserved account id for the Trading 212 ISA. Goals link to it like any
    // savings account; only the id is ever saved, never the live figures.
    const T212_ACCOUNT_ID = 't212-isa';

    const categoryOf = (id) => CATEGORIES.find((cat) => cat.id === id) || OTHER;
    const chipStyle = (cat, active) => ({
      display: 'inline-flex', alignItems: 'center', gap: 5, flexShrink: 0,
      fontSize: 11.5, fontWeight: 600, lineHeight: 1, padding: '5px 10px', borderRadius: 999,
      background: active ? cat.color + '2e' : 'rgba(148,163,184,0.08)',
      color: active ? cat.color : c.dim,
      border: `1px solid ${active ? cat.color + '59' : c.border}`,
      cursor: 'pointer', whiteSpace: 'nowrap', fontFamily: 'inherit', transition: 'all .15s',
    });

    // Part-to-whole at a glance. Slices are drawn in CATEGORIES order (see the
    // note there), separated by a hairline of the card surface, and capped at six
    // + Other because a donut stops being readable past that.
    const MAX_SLICES = 6;
    const polar = (cx, cy, r, deg) => {
      const rad = (deg - 90) * Math.PI / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    const arcPath = (cx, cy, rOuter, rInner, start, end) => {
      const [x1, y1] = polar(cx, cy, rOuter, start);
      const [x2, y2] = polar(cx, cy, rOuter, end);
      const [x3, y3] = polar(cx, cy, rInner, end);
      const [x4, y4] = polar(cx, cy, rInner, start);
      const large = end - start > 180 ? 1 : 0;
      return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
    };

    function CategoryDonut({ slices, total }) {
      const [active, setActive] = useState(null);
      const shown = active ? slices.find((sl) => sl.cat.id === active) : null;
      const cx = 100, cy = 100, rOuter = 92, rInner = 58;
      const gap = slices.length > 1 ? 1.6 : 0;

      let cursor = 0;
      const arcs = slices.map((sl) => {
        const sweep = (sl.amount / total) * 360;
        const seg = { ...sl, start: cursor, end: cursor + sweep };
        cursor += sweep;
        return seg;
      });

      return React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 20, alignItems: 'center', justifyContent: 'center' } },
        React.createElement('div', { style: { position: 'relative', width: 200, maxWidth: '100%', flexShrink: 0 } },
          React.createElement('svg', { viewBox: '0 0 200 200', style: { width: '100%', display: 'block' }, role: 'img', 'aria-label': 'Household bills by category' },
            slices.length === 1
              ? React.createElement('circle', { cx, cy, r: (rOuter + rInner) / 2, fill: 'none', stroke: slices[0].cat.color, strokeWidth: rOuter - rInner })
              : arcs.map((seg) => React.createElement('path', {
                  key: seg.cat.id,
                  d: arcPath(cx, cy, rOuter, rInner, seg.start + gap / 2, Math.max(seg.start + gap / 2, seg.end - gap / 2)),
                  fill: seg.cat.color,
                  opacity: !active || active === seg.cat.id ? 1 : 0.28,
                  style: { cursor: 'pointer', transition: 'opacity .15s' },
                  onMouseEnter: () => setActive(seg.cat.id),
                  onMouseLeave: () => setActive(null),
                  onClick: () => setActive(active === seg.cat.id ? null : seg.cat.id),
                }))
          ),
          React.createElement('div', { style: { position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none', textAlign: 'center', padding: '0 34px' } },
            React.createElement('div', { style: { fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.08em', color: c.faint, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '100%' } }, shown ? shown.cat.label : 'Total'),
            React.createElement('div', { className: 'font-mono', style: { fontSize: shown ? 17 : 18, fontWeight: 700, color: c.text, marginTop: 3 } }, currency(shown ? shown.amount : total)),
            shown && React.createElement('div', { className: 'font-mono', style: { fontSize: 11.5, color: c.faint, marginTop: 2 } }, (shown.amount / total * 100).toFixed(0) + '%')
          )
        ),
        // Legend doubles as the table view: every slice named, with its amount.
        React.createElement('div', { style: { flex: '1 1 190px', minWidth: 170, display: 'flex', flexDirection: 'column', gap: 2 } },
          slices.map((sl) => React.createElement('div', {
            key: sl.cat.id,
            onMouseEnter: () => setActive(sl.cat.id),
            onMouseLeave: () => setActive(null),
            onClick: () => setActive(active === sl.cat.id ? null : sl.cat.id),
            style: { display: 'flex', alignItems: 'center', gap: 8, padding: '5px 8px', borderRadius: 8, cursor: 'pointer', background: active === sl.cat.id ? 'rgba(148,163,184,0.1)' : 'transparent', opacity: !active || active === sl.cat.id ? 1 : 0.5, transition: 'all .15s' },
          },
            React.createElement('span', { style: { width: 10, height: 10, borderRadius: 3, background: sl.cat.color, flexShrink: 0 } }),
            React.createElement('span', { style: { fontSize: 12.5, color: c.dim, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, sl.cat.label),
            React.createElement('span', { className: 'font-mono', style: { fontSize: 12.5, color: c.text, fontWeight: 600 } }, currency(sl.amount)),
            React.createElement('span', { className: 'font-mono', style: { fontSize: 11, color: c.faint, width: 34, textAlign: 'right' } }, (sl.amount / total * 100).toFixed(0) + '%')
          ))
        )
      );
    }

    function DueDayEditor({ value, onChange }) {
      const [editing, setEditing] = useState(false);
      const [temp, setTemp] = useState('');

      const commit = () => {
        const parsed = parseInt(temp, 10);
        if (temp.trim() === '') onChange(null);
        else if (!isNaN(parsed)) onChange(Math.min(31, Math.max(1, parsed)));
        setEditing(false);
      };

      if (editing) {
        return React.createElement('input', {
          type: 'number', min: 1, max: 31, value: temp, autoFocus: true, placeholder: 'Day',
          onChange: (e) => setTemp(e.target.value),
          onBlur: commit,
          onKeyDown: (e) => e.key === 'Enter' && commit(),
          style: { width: 76, background: c.inset, border: `1px solid ${c.amber}`, borderRadius: 999, padding: '3px 10px', outline: 'none', color: c.text, fontSize: 16, fontFamily: "'JetBrains Mono', monospace" },
        });
      }
      const set = typeof value === 'number';
      return React.createElement('button', {
        onClick: () => { setTemp(set ? String(value) : ''); setEditing(true); },
        title: set ? 'Change or clear the due date' : 'Set the day this bill leaves the account',
        style: { ...chipStyle(OTHER, set), color: set ? c.blue : c.faint, borderColor: set ? 'rgba(57,135,229,0.45)' : c.border, background: set ? 'rgba(57,135,229,0.14)' : 'transparent' },
      }, set ? '📅 ' + ordinal(value) : '📅 Due date');
    }

    function PayDayEditor({ value, onChange, holidaysKnown }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (!open) return;
        const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('touchstart', onDown);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('touchstart', onDown);
        };
      }, [open]);

      const isLast = value === 'last';
      return React.createElement('div', { ref, style: { position: 'relative', display: 'inline-block' } },
        React.createElement('button', {
          onClick: () => setOpen(!open),
          title: 'When this pay lands',
          style: { ...chipStyle(OTHER, true), color: c.green, borderColor: 'rgba(25,158,112,0.5)', background: 'rgba(25,158,112,0.14)' },
        }, '💷 ' + payDayLabel(value)),
        open && React.createElement('div', {
          style: { position: 'absolute', top: 'calc(100% + 6px)', left: 0, zIndex: 30, width: 220, padding: 8, borderRadius: 14, background: '#111b30', border: `1px solid ${c.borderHi}`, boxShadow: '0 16px 36px rgba(3,7,18,0.65)', display: 'flex', flexDirection: 'column', gap: 8 }
        },
          React.createElement('button', {
            onClick: () => { onChange('last'); setOpen(false); },
            style: { ...chipStyle(OTHER, isLast), color: isLast ? c.green : c.dim, borderColor: isLast ? 'rgba(25,158,112,0.5)' : c.border, background: isLast ? 'rgba(25,158,112,0.14)' : 'transparent', justifyContent: 'flex-start', width: '100%' },
          }, 'Last working day'),
          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
            React.createElement('span', { style: { fontSize: 12.5, color: c.dim, flex: 1 } }, 'Day of month'),
            React.createElement('input', {
              type: 'number', min: 1, max: 31, value: isLast ? '' : value, placeholder: '25',
              onChange: (e) => {
                const parsed = parseInt(e.target.value, 10);
                if (!isNaN(parsed)) onChange(Math.min(31, Math.max(1, parsed)));
              },
              style: { width: 64, background: c.inset, border: `1px solid ${c.borderHi}`, borderRadius: 999, padding: '3px 10px', outline: 'none', color: c.text, fontSize: 16, fontFamily: "'JetBrains Mono', monospace" },
            })
          ),
          React.createElement('div', { style: { ...s.hint, marginTop: 0, lineHeight: 1.45 } },
            holidaysKnown
              ? 'A payday on a weekend or an England & Wales bank holiday rolls back to the working day before.'
              : 'A weekend payday rolls back to the Friday before. Bank holiday dates aren’t available right now.')
        )
      );
    }

    function AccountPicker({ accounts, selected, onToggle }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (!open) return;
        const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('touchstart', onDown);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('touchstart', onDown);
        };
      }, [open]);

      const count = selected.length;
      return React.createElement('div', { ref, style: { position: 'relative', display: 'inline-block' } },
        React.createElement('button', {
          onClick: () => setOpen(!open),
          title: 'Back this goal with savings accounts',
          style: { ...chipStyle(OTHER, count > 0), color: count > 0 ? c.green : c.faint, borderColor: count > 0 ? 'rgba(25,158,112,0.5)' : c.border, background: count > 0 ? 'rgba(25,158,112,0.14)' : 'transparent' },
        }, count === 0 ? '🔗 Track manually' : '🔗 ' + count + (count === 1 ? ' account' : ' accounts')),
        open && React.createElement('div', {
          style: { position: 'absolute', top: 'calc(100% + 6px)', left: 0, zIndex: 30, width: 240, maxHeight: 260, overflowY: 'auto', padding: 6, borderRadius: 14, background: '#111b30', border: `1px solid ${c.borderHi}`, boxShadow: '0 16px 36px rgba(3,7,18,0.65)', display: 'flex', flexDirection: 'column', gap: 4 }
        },
          accounts.length === 0
            ? React.createElement('div', { style: { fontSize: 12.5, color: c.faint, padding: 8, lineHeight: 1.5 } }, 'No savings accounts yet — add one below and it can back a goal.')
            : accounts.map((a) => {
                const on = selected.includes(a.id);
                return React.createElement('button', {
                  key: a.id,
                  onClick: () => onToggle(a.id),
                  style: { display: 'flex', alignItems: 'center', gap: 8, width: '100%', padding: '7px 8px', borderRadius: 9, cursor: 'pointer', textAlign: 'left', fontFamily: 'inherit', fontSize: 12.5, border: `1px solid ${on ? 'rgba(25,158,112,0.5)' : 'transparent'}`, background: on ? 'rgba(25,158,112,0.14)' : 'transparent', color: on ? c.text : c.dim },
                },

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState("overview");
      const [lastSaved, setLastSaved] = useState(null);
      const saveTimeout = useRef(null);
      const [t212, setT212] = useState(null);
      const [t212Loading, setT212Loading] = useState(false);
      const [showHoldings, setShowHoldings] = useState(false);
      const [splitOpen, setSplitOpen] = useState(null); // index of the bill whose split slider is open
      const t212FetchedAt = useRef(0);

      // Live ISA figures are kept out of `data` on purpose: `data` is PUT back to
      // the server wholesale, and fetched balances have no business being saved.
      const loadT212 = useCallback((refresh = false) => {
        // The server caches for T212_CACHE_TTL (5 min default); match it here so
        // tab switches don't queue up pointless requests.
        if (!refresh && Date.now() - t212FetchedAt.current < 5 * 60 * 1000) return;
        setT212Loading(true);
        fetch('/api/trading212' + (refresh ? '?refresh=1' : ''))
          .then(r => r.json())
          .then(d => { setT212(d); t212FetchedAt.current = Date.now(); })
          .catch(() => setT212({ configured: true, error: 'Could not reach the server' }))
          .finally(() => setT212Loading(false));
      }, []);

      useEffect(() => { loadT212(); }, [loadT212]);

      useEffect(() => {
        api.load().then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
      }, []);

      useEffect(() => { if (activeTab === 'savings') loadT212(); }, [activeTab, loadT212]);


      // What-if mode: `sandbox` holds the real, last-saved document while the user
      // plays with the numbers. Every edit still flows through save(), it just
      // stops short of the PUT until they keep or discard the changes.
      const [sandbox, setSandbox] = useState(null);
      const sandboxRef = useRef(null);
      sandboxRef.current = sandbox;

      const save = useCallback((newData) => {
        setData(newData);
        if (sandboxRef.current) return; // what-if edits never touch the disk
        // Debounce saves to avoid hammering the disk
        if (saveTimeout.current) clearTimeout(saveTimeout.current);
        saveTimeout.current = setTimeout(() => {
          api.save(newData).then(r => { if (r.ok) setLastSaved(new Date()); });
        }, 500);
      }, []);

      // Bank holidays. Fetched once — the server caches them to disk and only
      // refreshes daily, so this is cheap and works offline after the first run.
      const [holidays, setHolidays] = useState(null);
      useEffect(() => {
        fetch('/api/bank-holidays')
          .then(r => r.json())
          .then(d => setHolidays(new Set((d && d.dates) || [])))
          .catch(() => setHolidays(new Set()));
      }, []);
      const holidaySet = holidays || NO_HOLIDAYS;
      const holidaysKnown = holidaySet.size > 0;

      // --- Backup & restore ---
      const [backups, setBackups] = useState(null);
      const [backupOpen, setBackupOpen] = useState(false);
      const [pendingFile, setPendingFile] = useState(null);   // parsed upload awaiting confirmation
      const [confirmSnapshot, setConfirmSnapshot] = useState(null);
      const [restoreMsg, setRestoreMsg] = useState(null);
      const fileInputRef = useRef(null);

      const loadBackups = useCallback(() => {
        fetch('/api/backups')
          .then(r => r.json())
          .then(d => setBackups(d.backups || []))
          .catch(() => setBackups([]));
      }, []);

      useEffect(() => { if (backupOpen) loadBackups(); }, [backupOpen, loadBackups]);

      useEffect(() => {
        if (!backupOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') setBackupOpen(false); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [backupOpen]);

      // The server writes the file and hands back what it stored, so adopt that
      // rather than the local copy - it has been sanitised on the way through.
      const applyRestore = (payload, label) => {
        setRestoreMsg({ tone: 'busy', text: 'Restoring…' });
        fetch('/api/restore', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
          .then(r => r.json().then(body => ({ ok: r.ok, body })))
          .then(({ ok, body }) => {
            if (!ok || !body.data) throw new Error(body.error || 'Restore failed');
            setData(body.data);
            setLastSaved(new Date());
            setRestoreMsg({ tone: 'good', text: 'Restored ' + label });
            loadBackups();
          })
          .catch(err => setRestoreMsg({ tone: 'bad', text: err.message }));
        setPendingFile(null);
        setConfirmSnapshot(null);
      };

      const onFilePicked = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = ''; // let the same file be picked again after a cancel
        if (!file) return;
        file.text().then(text => {
          try {
            setPendingFile({ name: file.name, data: JSON.parse(text) });
            setRestoreMsg(null);
          } catch (err) {
            setRestoreMsg({ tone: 'bad', text: 'That file isn’t valid JSON' });
          }
        });
      };

      const startWhatIf = () => {
        if (saveTimeout.current) clearTimeout(saveTimeout.current); // flush nothing half-written
        api.save(data).then(r => { if (r.ok) setLastSaved(new Date()); });
        setSandbox(data);
      };
      const discardWhatIf = () => { setData(sandbox); setSandbox(null); };
      const keepWhatIf = () => {
        const kept = data;
        setSandbox(null);
        api.save(kept).then(r => { if (r.ok) setLastSaved(new Date()); });
      };
      // Goals reference accounts by id, so back-fill ids on documents saved
      // before goals existed. Runs once - after this every account has one.
      useEffect(() => {
        if (!data || !(data.savings || []).some(a => !a.id)) return;
        save({ ...data, savings: data.savings.map(a => a.id ? a : { ...a, id: uid() }) });
      }, [data, save]);

      if (loading || !data) {
        return React.createElement('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
          React.createElement('div', { style: { color: '#b6c2d4', fontSize: 16 } }, 'Loading budget…')
        );
      }

      const p1 = data.person1Name || "Person 1";
      const p2 = data.person2Name || "Person 2";
      const householdTotal = data.householdBills.reduce((s, b) => s + b.amount, 0);
      const p1PersonalTotal = (data.person1Expenses || []).reduce((s, e) => s + e.amount, 0);
      const p2PersonalTotal = (data.person2Expenses || []).reduce((s, e) => s + e.amount, 0);
      // splitPercent is person1's share. A bill without one falls back to the
      // household default; person2 always takes the remainder, so the two
      // shares add back up to the bill exactly.
      const defaultSplit = typeof data.splitPercent === 'number' ? data.splitPercent : 50;
      const splitOf = (bill) => typeof bill.splitPercent === 'number' ? bill.splitPercent : defaultSplit;
      const p1BillsShare = data.householdBills.reduce((s, b) => s + b.amount * splitOf(b) / 100, 0);
      const p2BillsShare = householdTotal - p1BillsShare;
      const p1BillShare = p1BillsShare + p1PersonalTotal;
      const p2BillShare = p2BillsShare + p2PersonalTotal;
      const extraIncomeTotal = (data.extraIncome || []).reduce((s, e) => s + e.amount, 0);
      const totalIncome = (data.person1Pay || 0) + (data.person2Pay || 0) + extraIncomeTotal;
      const totalExpenditure = householdTotal + p1PersonalTotal + p2PersonalTotal;
      const totalLeft = totalIncome - totalExpenditure;
      const p1Left = (data.person1Pay || 0) - p1BillShare;
      const p2Left = (data.person2Pay || 0) - p2BillShare;
      const totalSavings = (data.savings || []).reduce((s, a) => s + a.balance, 0);
      const annualInterest = (data.savings || []).reduce((s, a) => s + a.balance * (a.interestRate / 100), 0);

      // Trading 212 ISA. `free` is uninvested cash and earns interest like any
      // savings account, so it joins the cash figures; the holdings are counted
      // separately as investments.
      const isaCash = (t212 && t212.cash) || null;
      const isaFreeCash = isaCash ? isaCash.free : 0;
      const isaHoldingsValue = isaCash ? isaCash.holdingsValue : 0;
      const isaInvested = isaCash ? isaCash.invested : 0;
      const isaPpl = isaCash ? isaCash.ppl : 0;
      const isaPplPercent = isaInvested > 0 ? (isaPpl / isaInvested) * 100 : 0;
      const t212CashRate = data.t212CashRate || 0;
      const isaCashInterest = isaFreeCash * (t212CashRate / 100);

      // The ISA as a goal-linkable account. Its blended rate is the cash rate
      // diluted over the whole balance — holdings carry no fixed rate.
      const isaAccount = isaCash ? {
        id: T212_ACCOUNT_ID,
        name: 'Trading 212 ISA',
        holder: 'Investments',
        balance: isaCash.total,
        interestRate: isaCash.total > 0 ? (isaFreeCash * t212CashRate) / isaCash.total : 0,
      } : null;
      const goalAccounts = [...(data.savings || []).filter(a => a.id), ...(isaAccount ? [isaAccount] : [])];

      const mortgage = data.mortgage || {};
      const updateMortgage = (field, value) => save({ ...data, mortgage: { ...mortgage, [field]: value } });

      // Paydays: person1 defaults to the last working day, person2 to the 25th.
      const p1PayDay = payDayOf(data.person1PayDay, 'last');
      const p2PayDay = payDayOf(data.person2PayDay, 25);

      const cashSavings = totalSavings + isaFreeCash;
      const totalAnnualInterest = annualInterest + isaCashInterest;
      const monthlyInterest = totalAnnualInterest / 12;
      const combinedTotal = cashSavings + isaHoldingsValue;

      const updateBill = (i, field, value) => { const u = { ...data, householdBills: [...data.householdBills] }; u.householdBills[i] = { ...u.householdBills[i], [field]: value }; save(u); };
